<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17594a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SchützenTracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="SchützenTracker – Training, Rundenkampf und Verein für Bogen-, Gewehr- und Pistolenschützen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SchützenTracker</title>
<style>
/* Layout: one narrow column like a paper Rundenzettel. Sticky team scoreboard on top, round disc keypad (target ring colours) docked at the bottom. */
:root {
  --bg: #eceee9;
  --surface: #f8f9f6;
  --surface-2: #e1e6df;
  --ink: #1b2420;
  --ink-2: #55625a;
  --line: #cbd2c8;
  --accent: #17594a;
  --accent-ink: #ffffff;
  --danger: #a8322d;
  --home: #0f6b6b;
  --home-ink: #ffffff;
  --guest: #7a3b69;
  --guest-ink: #ffffff;
  --ring-gold: #f2c230;
  --ring-gold-ink: #1b1a10;
  --ring-red: #c8352f;
  --ring-blue: #2c6cb0;
  --ring-black: #23282b;
  --ring-white: #f5f5f1;
  --ring-white-ink: #1b2420;
  --ring-miss: #c5cbc3;
  --ring-miss-ink: #3a463f;
  --f-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121815;
    --surface: #1a221e;
    --surface-2: #232d28;
    --ink: #e6ece7;
    --ink-2: #9aa8a0;
    --line: #2f3b35;
    --accent: #5bc2a4;
    --accent-ink: #0d1612;
    --danger: #ef7a73;
    --home: #4fbfbf;
    --home-ink: #0a1414;
    --guest: #d58bc2;
    --guest-ink: #1a0c16;
    --ring-gold: #e8b923;
    --ring-gold-ink: #17150c;
    --ring-red: #d9453d;
    --ring-blue: #3f86d1;
    --ring-black: #0b0e10;
    --ring-white: #e9ebe6;
    --ring-white-ink: #1b2420;
    --ring-miss: #3a4540;
    --ring-miss-ink: #c9d2cc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121815;
  --surface: #1a221e;
  --surface-2: #232d28;
  --ink: #e6ece7;
  --ink-2: #9aa8a0;
  --line: #2f3b35;
  --accent: #5bc2a4;
  --accent-ink: #0d1612;
  --danger: #ef7a73;
  --home: #4fbfbf;
  --home-ink: #0a1414;
  --guest: #d58bc2;
  --guest-ink: #1a0c16;
  --ring-gold: #e8b923;
  --ring-gold-ink: #17150c;
  --ring-red: #d9453d;
  --ring-blue: #3f86d1;
  --ring-black: #0b0e10;
  --ring-white: #e9ebe6;
  --ring-white-ink: #1b2420;
  --ring-miss: #3a4540;
  --ring-miss-ink: #c9d2cc;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.4 var(--f-body);
  padding-block: 12px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
h1, h2, h3, p, dl, dd, ul { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; min-width: 0; }
.wrap.has-pad { padding-bottom: 250px; }
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.dialog { width: min(100%, 360px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.dialog h3 { font: 700 22px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.panel .sub-h { font: 700 16px var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }
.sigbox { display: grid; gap: 4px; }
.sighead { justify-content: space-between; }
canvas.sig { display: block; width: 100%; aspect-ratio: 5.7 / 1; background: #fff; border: 1px solid var(--line); border-radius: 6px; touch-action: none; cursor: crosshair; }
.hub { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 2px; min-height: 140px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; }
.tile svg { width: 48px; height: 48px; margin-bottom: auto; }
.tile svg.gun { width: 120px; max-width: 100%; color: var(--ink); }
.tile.off svg.gun { color: var(--ink-2); }
.tile b { font: 700 clamp(15px, 4.4vw, 22px)/1.05 var(--f-display); letter-spacing: 0; text-transform: uppercase; max-width: 100%; }
.tile small { font-size: 13px; color: var(--ink-2); }
.tile:not(.off) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile.off { opacity: .55; cursor: default; }
.tile.stxt { align-items: center; justify-content: center; text-align: center; min-height: 110px; }
.board.solo { grid-template-columns: minmax(0, 1fr); }
.hub .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.facebox { margin-top: 12px; display: grid; gap: 8px; }
.facebox .now-line { margin: 0; text-align: center; }
svg.facein, svg.faceout { display: block; width: 100%; max-width: 420px; margin: 0 auto; }
svg.facein { touch-action: none; cursor: crosshair; }
svg.facein.tall, svg.faceout.tall { max-width: 270px; }
.tabs { display: flex; gap: 6px; margin-top: 12px; border-bottom: 2px solid var(--line); }
.tab { flex: 1; padding: 10px 8px; font: 700 15px var(--f-body); border: 0; background: none; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs.tabs5 { gap: 0; overflow-x: auto; scrollbar-width: none; }
.tabs.tabs5 .tab { flex: 0 0 auto; padding: 10px 14px; font-size: 14px; white-space: nowrap; }
.statgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font: 700 26px var(--f-display); }
.stat span { font-size: 12.5px; color: var(--ink-2); }
.dist { display: grid; gap: 5px; }
.drow { display: grid; grid-template-columns: 2.6em 1fr 5.6em; gap: 8px; align-items: center; font-size: 13px; }
.drow .dk { font-weight: 700; }
.drow .dbar { background: var(--surface-2); border-radius: 4px; height: 12px; overflow: hidden; }
.drow .dbar i { display: block; height: 100%; background: var(--accent); }
.drow .dv { text-align: right; color: var(--ink-2); }
.trend { display: flex; gap: 4px; align-items: flex-end; height: 140px; }
.tcol { flex: 1; min-width: 0; height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 3px; text-align: center; font-size: 11px; }
.tcol .tb { display: flex; align-items: flex-end; }
.tcol .tb i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }
.tcol .tv { font-weight: 700; }
.tcol .td { color: var(--ink-2); }
.rowdel { display: grid; gap: 4px; }
.rowdel .delx { justify-self: end; font-size: 13px; padding: 4px 10px; min-height: 0; }
.rowdel .delask { justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 8px; }
.zoombar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.zoombar .zl { min-width: 3.2em; text-align: center; font: 700 15px var(--f-body); }
.zoombar .btn.on { background: var(--accent); color: #fff; }
.zhint { margin: 0; text-align: center; font-size: 12.5px; }
.readout { text-align: center; font: 600 14px var(--f-body); color: var(--ink-2); min-height: 1.4em; }
.freport { display: grid; gap: 8px; }
.fstats { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.chipline { display: flex; flex-wrap: wrap; gap: 6px; }
.rchips { display: flex; flex-wrap: wrap; gap: 8px; }
.rchip { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.rchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rchip:disabled { opacity: .6; }
.dd { display: grid; gap: 6px; }
.dd-btn { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dd-list { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: grid; overflow: hidden; }
.dd-opt { min-height: 44px; padding: 0 12px; display: flex; gap: 10px; align-items: center; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-weight: 600; }
.dd-opt:last-child { border-bottom: 0; }
.dd-opt .bx { width: 22px; height: 22px; flex: none; border: 2px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 14px; }
.dd-opt[aria-pressed="true"] .bx { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tagline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.wrap.pad-off { padding-bottom: 90px; }
.padhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.padhead .now-line { margin: 0; text-align: left; flex: 1; min-width: 0; }
.padclose, .padopen { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-2); font: 600 14px var(--f-body); flex: none; }
.padopen { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.3); }

/* Buttons and fields */
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface);
  font: 600 15px var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--bg); }
.btn.quiet { background: transparent; border-color: transparent; padding: 0 8px; }
.btn.wide { width: 100%; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
select, input[type="text"], input[type="date"], input[type="number"], input[type="email"], input[type="password"] {
  height: 44px; min-height: 44px; width: 100%; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px; padding: 0 12px;
  background: var(--bg); color: var(--ink); font: 400 16px var(--f-body);
}
textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--f-body); resize: vertical;
}
.check { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 6px 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.notice.ok { border-color: var(--accent); color: var(--accent); }
.notice { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--danger); border-radius: 8px; color: var(--danger); font-size: 14px; }
.muted { color: var(--ink-2); font-size: 13px; }

/* Home */
.brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 8px 0 4px; }
.logo { width: 72px; height: 72px; flex: none; border-radius: 22%; }
.brand h1 { font: 700 clamp(18px, 5.6vw, 32px)/1.05 var(--f-display); letter-spacing: .03em; overflow-wrap: anywhere; text-transform: uppercase; }
.brand p { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.listbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-top: 20px; }
.listbar h2 { font: 700 22px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.mlist { list-style: none; padding: 0; margin-top: 12px; display: grid; gap: 10px; }
.mrow { width: 100%; text-align: left; display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.mrow .meta { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.mrow .vs { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto minmax(0, 1fr); gap: 8px; align-items: baseline; }
.tn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn.home { text-align: right; color: var(--home); }
.tn.guest { color: var(--guest); }
.sc { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.col { font: 600 22px/1 var(--f-display); color: var(--ink-2); }
.status { font-size: 13px; color: var(--ink-2); }
.status.done { color: var(--accent); font-weight: 600; }
.empty { margin-top: 16px; padding: 20px; border: 1px dashed var(--line); border-radius: 10px; display: grid; gap: 6px; color: var(--ink-2); }
.foot { margin-top: 24px; }
.copy { margin-top: 16px; padding-bottom: 8px; text-align: center; font-size: 11px; color: var(--ink-2); }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* New match form */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.topbar .meta { font-size: 13px; color: var(--ink-2); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptitle { font: 700 30px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 14px; }
form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 12px; }
fieldset { margin: 0; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--surface); }
fieldset legend { padding: 0 6px; font: 700 15px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
fieldset.t0 legend { color: var(--home); }
fieldset.t1 legend { color: var(--guest); }
.steppers { display: grid; gap: 8px; }
.stepper { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.stepper .lab { display: flex; flex-direction: column; min-width: 0; }
.stepper .lab small { font: 400 13px var(--f-body); color: var(--ink-2); letter-spacing: 0; text-transform: none; }
.stepper .lab b { font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.step { display: flex; align-items: center; gap: 10px; }
.sbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font: 600 24px/1 var(--f-display); display: grid; place-items: center; padding: 0; }
.sbtn:disabled { opacity: .35; cursor: default; }
.step output { min-width: 2ch; text-align: center; font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.total { font-size: 14px; color: var(--ink-2); }

/* Wettkampfuhr */
.wkbar { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; margin: 8px 0 0; padding: 8px 8px 8px 12px; border-radius: 14px; }
.wkbar .wkl { min-width: 0; display: grid; text-align: left; }
.wkbar small { font: 600 11px/1.3 var(--f-body); opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wkbar b { font: 700 14px/1.3 var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wkt { font: 800 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.wkb { display: flex; gap: 6px; }
.wkbar .btn, .wkfull .btn { min-height: 40px; padding: 0 10px; background: rgba(255,255,255,.2); color: inherit; border: 1px solid rgba(255,255,255,.55); }
.wkbar .btn.primary, .wkfull .btn.primary { background: #fff; color: #14201a; border-color: #fff; }
.wk-green { background: #1b7a41; color: #fff; }
.wk-yellow { background: #f0b400; color: #1a1300; }
.wk-yellow .btn { border-color: rgba(26,19,0,.5); }
.wk-red { background: #b3261e; color: #fff; }
.wkfull { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.wkfull .wkg { margin: 0; font-weight: 700; opacity: .9; }
.wkfull h2 { font: 800 26px/1.2 var(--f-display); margin: 0; color: inherit; }
.wkbig { font: 800 clamp(88px, 30vw, 240px)/1 var(--f-display); font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
.wkctl { justify-content: center; flex-wrap: wrap; }
.wkfull .btn { min-height: 52px; padding: 0 20px; font-size: 17px; }
.wkfull .wksub .btn, .wkfull .wksub .btn.quiet { color: inherit; opacity: .95; min-height: 44px; font-size: 15px; background: transparent; border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.wkchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.wkset .sub { margin: 8px 0 0; }
@keyframes wkpop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.wkpop { animation: wkpop .25s ease-out; }
@media (prefers-reduced-motion: reduce) { .wkpop { animation: none; } }
.wkset .chip { min-height: 40px; padding: 6px 12px; }
.wkset .chip .cn { font-size: 14px; }
.wkset > .row-inline { margin: 4px 0 6px; }

/* Scoreboard (sticky) */
.board {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 0 12px;
}
.bside { min-width: 0; display: flex; flex-direction: column; }
.bside.home { --tc: var(--home); }
.bside.guest { --tc: var(--guest); text-align: right; }
.bn { font: 600 13px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--tc); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bs { font: 700 48px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.bcol { font: 600 32px/1 var(--f-display); color: var(--ink-2); padding-bottom: 6px; }
.bstat { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--surface-2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }

/* Archer chips */
.teams { display: grid; gap: 12px; margin-top: 14px; }
.tgroup { --tc: var(--home); --tci: var(--home-ink); }
.tgroup.t1, .sheet.t1 { --tc: var(--guest); --tci: var(--guest-ink); }
.tgroup h3 { font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--tc); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; }
.chip .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.chip .ct { font: 700 20px var(--f-display); font-variant-numeric: tabular-nums; }
.chip.sel { background: var(--tc); color: var(--tci); border-color: var(--tc); }

/* Score sheet */
.sheet { --tc: var(--home); margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--tc); border-radius: 10px; padding: 12px 10px 8px; }
.shead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 0 4px; }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--tc); }
.shead h2 { font: 700 30px/1.1 var(--f-display); letter-spacing: .02em; overflow-wrap: anywhere; }
.sstats { display: flex; gap: 16px; }
.sstats dt { font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.sstats dd { font: 700 28px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tbl { margin-top: 10px; }
.trow { display: grid; grid-template-columns: 2.2rem repeat(var(--k), minmax(0, 1fr)) 2.8rem 3.2rem; align-items: center; gap: 4px; padding: 4px; border-top: 1px solid var(--line); }
.trow.thead { border-top: 0; padding-top: 0; font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.trow.thead .aw { text-align: center; }
.trow.thead span:nth-last-child(-n+2) { text-align: right; }
.trow.now { background: var(--surface-2); border-radius: 8px; border-top-color: transparent; }
.pn { font: 600 17px var(--f-display); color: var(--ink-2); text-align: center; }
.sm, .rn { text-align: right; font: 700 21px var(--f-display); font-variant-numeric: tabular-nums; }
.sm.part, .rn { color: var(--ink-2); font-weight: 600; }

/* Ring discs: colours follow the target face */
.cell, .key {
  border: 0; padding: 0; display: grid; place-items: center; border-radius: 50%;
  font: 700 21px/1 var(--f-display); font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .45);
}
.cell { width: 100%; max-width: 46px; aspect-ratio: 1; margin: 0 auto; scroll-margin-top: 150px; scroll-margin-bottom: 260px; }
.cell.cur { outline: 3px solid var(--accent); outline-offset: 2px; }
.v-none { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line); }
.v-gold { background: var(--ring-gold); color: var(--ring-gold-ink); }
.v-red { background: var(--ring-red); color: #fff; }
.v-blue { background: var(--ring-blue); color: #fff; }
.v-black { background: var(--ring-black); color: #fff; }
.v-white { background: var(--ring-white); color: var(--ring-white-ink); }
.v-miss { background: var(--ring-miss); color: var(--ring-miss-ink); }
.v-X { box-shadow: inset 0 0 0 2px var(--ring-gold), inset 0 0 0 3.5px rgba(27, 26, 16, .6); }

/* Keypad */
.pad {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.padin { max-width: 420px; margin: 0 auto; }
.now-line { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; text-align: center; }
.now-line b { color: var(--ink); font-weight: 600; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; justify-items: center; }
.key { width: 100%; max-width: 54px; aspect-ratio: 1; transition: transform .08s; }
.key:active { transform: scale(.93); }
.key.del { grid-column: span 3; max-width: none; aspect-ratio: auto; align-self: stretch; border-radius: 27px; background: var(--surface-2); color: var(--ink); font: 600 16px var(--f-body); box-shadow: none; }

/* Panels */
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.panel { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.panel h3 { font: 700 20px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.panel .sub { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
.panel .sub.t0 { color: var(--home); }
.panel .sub.t1 { color: var(--guest); }
.row-inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Mannschaften und Schützenzeilen */
.tname { font: 700 24px/1.1 var(--f-display); letter-spacing: .03em; overflow-wrap: anywhere; }
.arow { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.arow.solo { grid-template-columns: minmax(0, 1fr) 44px; }
.arow input[type="checkbox"] { width: 22px; height: 22px; margin: 0 auto; accent-color: var(--accent); }
.arow2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
select { appearance: auto; }
/* iPhone-Web-App: kein Vergrößern durch Doppeltippen (schnelles Tippen auf Ringe/Knöpfe), Zwei-Finger-Zoom bleibt möglich */
html, body, * { touch-action: manipulation; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

.sheetprev { overflow-x: auto; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; }

/* Scheibenwahl */
.faces { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 10px; }
.opt { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; min-width: 0; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt b { font: 700 22px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.opt small { color: var(--ink-2); font-size: 13px; }
.opt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.sbgoal { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sbgoal b { font: 700 34px var(--f-display); }
.sbgoal b small { font: 600 14px var(--f-body); color: var(--ink-2); }
.sbgoal span { font-size: 13px; color: var(--ink-2); }
.sbbar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.sbbar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.sbset summary { cursor: pointer; font: 600 13px var(--f-body); color: var(--accent); padding: 4px 0; }
.sbset .grid2 { margin-top: 10px; }
.sbacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.rqhead { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; }
.rqht { display: grid; gap: 2px; min-width: 0; }
.rqchev { font-size: 18px; color: var(--ink-2); }
.rqopen .rqhead { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.rqbody { display: grid; gap: 2px; margin-top: -1px; }
.tag.sres.w { background: #e3f4ea; color: #14532d; border-color: transparent; }
.tag.sres.d { background: var(--bg); }
.tag.sres.l { background: #fbe9e5; color: #7a2617; border-color: transparent; }
.rqnew { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rcthread { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.rcmsg { max-width: 85%; margin: 6px 0; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: var(--bg); border: 1px solid var(--line); }
.rcmsg.me { margin-left: auto; border-radius: 14px 14px 4px 14px; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rcmsg small { display: block; font-size: 11px; opacity: .75; }
.rcmsg p { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; }
</style>

<style>
/* Modernes UI: ruhige, helle Flächen, große Radien, weiche Schatten, Segment-Tabs. Nur Optik, die Logik bleibt unverändert. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #e9edf1;
  --ink: #0f1a22;
  --ink-2: #5a6773;
  --line: #e2e7ec;
  --accent: #0b6e5a;
  --accent-ink: #ffffff;
  --danger: #c0392b;
  --home: #0b7a7a;
  --guest: #8a3f78;
  --f-display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --shadow: 0 1px 2px rgba(15,26,34,.05), 0 10px 24px -14px rgba(15,26,34,.22);
  --shadow-up: 0 -10px 30px -12px rgba(15,26,34,.25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1013; --surface: #141b20; --surface-2: #1e272d; --ink: #eaf0f3; --ink-2: #94a3ad; --line: #26323a;
    --accent: #4fd1b0; --accent-ink: #06130f; --danger: #f0867b; --home: #55c7c7; --guest: #dc95ca;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7); --shadow-up: 0 -10px 30px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1013; --surface: #141b20; --surface-2: #1e272d; --ink: #eaf0f3; --ink-2: #94a3ad; --line: #26323a;
  --accent: #4fd1b0; --accent-ink: #06130f; --danger: #f0867b; --home: #55c7c7; --guest: #dc95ca;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7); --shadow-up: 0 -10px 30px -12px rgba(0,0,0,.7);
  color-scheme: dark;

  /* ===================== WETTKAMPFUHR =====================
     Zeiten nach Regelwerk:
     - Bogen: DSB-Sportordnung Teil 6 (6.3.1 Signale, 6.4.3.1 Halle: 3 Pfeile in 2 Min., 6.5.3.1 Freien: 6 Pfeile in 4 Min.,
       je 10 s Vorlauf, gelb 30 s vor Ende).
     - Luftgewehr/Luftpistole: 15 Min. Vorbereitungs- und Probezeit, 40 Schuss in 50 Min. (elektronisch) bzw. 60 Min. (Papier),
       Ansagen „noch 10 / 5 Minuten“ (DSB-Ansagetext für Schießleiter); andere Schusszahlen im selben Verhältnis.

  var wk = null, wkT = null, wkAC = null, wkLock = null;

  function wkDur(s) { return s % 60 ? (s >= 60 ? Math.floor(s / 60) + ' Min. ' : '') + (s % 60) + ' s' : (s / 60) + ' Min.'; }

  function wkProgram(m) {
    var sp = sportOf(m), P = [], E = m.ends, A = m.arrows, i;

        var pl = 'Passe ' + (i + 1) + ' von ' + E, g1 = i % 2 ? 'CD' : 'AB', g2 = i % 2 ? 'AB' : 'CD';
        ph({ t: 'run', g: pl, lab: two ? 'Gruppe ' + g1 + ' an die Linie' : 'An die Schießlinie', sec: 10, col: 'red', sig: 'w2' });
        ph({ t: 'run', g: pl, lab: two ? 'Schießzeit Gruppe ' + g1 : 'Schießzeit', sec: per, col: 'green', sig: 'w1', yel: 30 });
        if (two) {
          ph({ t: 'run', g: pl, lab: 'Wechsel: Gruppe ' + g2 + ' an die Linie', sec: 10, col: 'red', sig: 'w2' });
          ph({ t: 'run', g: pl, lab: 'Schießzeit Gruppe ' + g2, sec: per, col: 'green', sig: 'w1', yel: 30 });
        }
        ph({ t: 'wait', g: pl, lab: i + 1 < E ? 'Pfeile eintragen' : 'Letzte Passe geschossen', col: 'red', sig: 'w3', next: i + 1 < E ? 'Nächste Passe' : '' });
      }
    } else if (sp === 'sp') {
      var half = Math.ceil(E / 2), parts = [['p', 'Präzision', half], ['d', 'Duell', E - half]];
      parts.forEach(function (pt) {
        for (var s = 0; s <= pt[2]; s++) {

          ph({ t: 'run', g: gl, lab: 'Laden', sec: 60, col: 'red', say: 'Laden.', sig: 'b1' });
          if (pt[0] === 'p') ph({ t: 'run', g: gl, lab: 'Schießzeit', sec: 300, col: 'green', say: 'Start.', sig: 'b1', calls: [[60, 'Noch eine Minute']] });
          else {

            for (var k = 1; k <= A; k++) {

              if (k < A) ph({ t: 'run', g: gl, lab: 'Pause vor Schuss ' + (k + 1), sec: 7, col: 'red' });
            }
          }
          ph({ t: 'wait', g: gl, lab: last ? 'Wettkampf beendet' : (s ? 'Serie beendet, Treffer eintragen' : 'Probeserie beendet'), col: 'red', sig: 'b3', say: 'Stopp.', next: last ? '' : 'Nächste Serie' });
        }

      ph({ t: 'wait', g: 'Vorbereitung', lab: 'Probezeit beendet', col: 'red', sig: 'b3', say: 'Stopp.', next: 'Wettkampf starten' });
      ph({ t: 'run', g: n + ' Wettkampfschüsse in ' + min + ' Min.', lab: 'Wettkampfzeit', sec: min * 60, col: 'green', sig: 'b1', say: 'Wir beginnen jetzt mit dem Wettkampf. Start.', calls: [[600, 'Noch 10 Minuten'], [300, 'Noch 5 Minuten'], [60, 'Noch eine Minute']], yel: 300 });
      ph({ t: 'wait', g: n + ' Wettkampfschüsse', lab: 'Wettkampfzeit beendet', col: 'red', sig: 'b3', say: 'Stopp.', next: '' });
    }
    return P;
  }

  /* ---- Signale: Schiedsrichterpfiff (lang beim Bogen, kurz bei Gewehr/Pistole), Sprachansage, Vibration ---- */
  function wkUnlock() {
    try { var AC = window.AudioContext || window.webkitAudioContext; if (!wkAC && AC) wkAC = new AC(); if (wkAC && wkAC.state === 'suspended') wkAC.resume(); } catch (e) { /* ohne Ton */ }
    try { if (wkCfg.voice && window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (e) { /* ohne Sprache */ }
  }
  /* Schiedsrichterpfeife: hoher Ton um 3,2 kHz, die Kugel in der Pfeife erzeugt das schnelle Trillern; dazu etwas Luftrauschen */
  function wkWhistle(t0, dur) {
    var AC = wkAC, out = AC.createGain(), bp = AC.createBiquadFilter(), tr = AC.createOscillator(), trF = AC.createGain(), trA = AC.createGain(), am = AC.createGain();
    out.gain.setValueAtTime(0.0001, t0); out.gain.exponentialRampToValueAtTime(0.5, t0 + 0.015);
    out.gain.setValueAtTime(0.5, t0 + dur - 0.04); out.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    am.gain.value = 0.75; tr.type = 'triangle'; tr.frequency.value = 34; trF.gain.value = 140; trA.gain.value = 0.25;
    tr.connect(trF); tr.connect(trA); trA.connect(am.gain);
    am.connect(out); out.connect(AC.destination);
    [[3150, 0.5], [3290, 0.32]].forEach(function (v) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(v[0] * 0.97, t0); o.frequency.exponentialRampToValueAtTime(v[0], t0 + 0.03);
      trF.connect(o.frequency); g.gain.value = v[1]; o.connect(g); g.connect(am); o.start(t0); o.stop(t0 + dur + 0.02);
    });
    var len = Math.ceil(AC.sampleRate * (dur + 0.05)), nb = AC.createBuffer(1, len, AC.sampleRate), d = nb.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var ns = AC.createBufferSource(), ng = AC.createGain(); ns.buffer = nb;
    bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 3; ng.gain.value = 0.12;
    ns.connect(bp); bp.connect(ng); ng.connect(am); ns.start(t0); ns.stop(t0 + dur + 0.02);
    tr.start(t0); tr.stop(t0 + dur + 0.02);
  }
  function wkSig(s) {
    var n = +s.slice(1), long = s.charAt(0) === 'w', pat = [], d = long ? 0.55 : 0.3, gap = long ? 0.22 : 0.15;
    for (var i = 0; i < n; i++) pat.push(Math.round(d * 1000), Math.round(gap * 1000));

  }
  function wkSay(txt) { if (!wkCfg.voice || !txt) return; try { var u = new SpeechSynthesisUtterance(txt); u.lang = 'de-DE'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* ignore */ } }
  function wkWake(on) {
    try {
      if (on && !wkLock && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wkLock = l; l.addEventListener('release', function () { wkLock = null; }); }, noop);
      else if (!on && wkLock) { wkLock.release(); wkLock = null; }
    } catch (e) { /* ignore */ }
  }
  document.addEventListener('visibilitychange', function () { if (wk && !document.hidden) { wkWake(true); wkTick(); } });

  /* ---- Ablauf ---- */
  function wkPrepare(m) { wk = { mid: m.id, secOnly: sportOf(m) === 'bogen', P: wkProgram(m), i: -1, endAt: 0, left: 0, paused: false, fired: {} }; clearInterval(wkT); wkT = setInterval(wkTick, 200); wkWake(true); ui.wkFull = true; }
  function wkStart(m) { wkUnlock(); wkPrepare(m); wkGo(0); }
  function wkEndNow() { for (var j = wk.i + 1; j < wk.P.length; j++) if (wk.P[j].t === 'wait') { wkGo(j); return; } wkStop(); }
  function wkStop() { wk = null; clearInterval(wkT); wkWake(false); ui.wkFull = false; try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } render(); }
  function wkGo(i) {

    // Während die Zeit läuft nur die Uhr; ist sie um, erscheinen die Eingabefelder

      return { p: { t: 'ready', g: wk.P[0].g, lab: 'Bereit? Tippe auf Start.', sec: g0 ? g0.sec : 0 }, s: g0 ? g0.sec : 0, col: 'red' };
    }
    var p = wk && wk.P[wk.i]; if (!p) return null;

    if (formId === 'vrform') { vrSubmit(); return; }
    if (formId === 'joinform') { joinClub(val('cl-code')); return; }

    if (formId === 'tremform') { sendTeamRem(e.target); return; }
    if (formId === 'clubnew') { adm.newCode = null; admDo(api('POST', '/rest/v1/rpc/admin_create_club', { p_name: val('adm-newclub').trim() }).then(function (r) { adm.newCode = r; }, function (e) { throw new Error(e.status === 404 ? 'Die Datenbank ist noch nicht auf dem neuesten Stand (Update 17 fehlt).' : e.message); }), 'Verein angelegt. Du bist kein Mitglied.'); return; }
    if (formId === 'clubrename') { admDo(api('PATCH', '/rest/v1/clubs?id=eq.' + adm.club, { name: val('adm-cname').trim() }), 'Verein umbenannt.'); return; }
    if (formId === 'teamform') { saveTeam(); return; }
    if (formId !== 'newform') return;
    syncDraft();
    if (ui.draft.training && !(ui.draft.title || '').trim()) { ui.formError = 'Bitte gib einen Namen ein.'; render(); return; }
    var bad = ui.draft.teams.some(function (t) {
      var n = t.archers.filter(function (a) { return a.use; }).length;
      return n < 1 || n > MAX_ARCHERS;
    });
    if (bad) { ui.formError = ui.draft.training ? 'Wähle 1 bis ' + MAX_ARCHERS + ' Schützen aus.' : 'Wähle je Mannschaft 1 bis ' + MAX_ARCHERS + ' Schützen aus.'; render(); return; }
    ui.formError = '';
    if (!ui.draft.training) ui.draft.clubId = autoClub();
    var m = makeMatch(ui.draft);
    store.matches.push(m); store.openId = m.id; save();
    ui.matchId = m.id; ui.view = 'match'; ui.settings = ui.confirm = ui.result = false;
    if (ui.draft.clock) { wkUnlock(); wkPrepare(m); } else if (wk) { wk = null; clearInterval(wkT); wkWake(false); ui.wkFull = false; }
    ui.draft = null;
    render({ top: true });
  });

  document.addEventListener('keydown', function (e) {
    if (ui.view !== 'match') return;
    var cm = curMatch(); if (cm && cm.input === 'face') return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, v = null;
    if (/^[1-9]$/.test(k)) v = k;
    else if (k === '0') v = '10';
    else if (k === 'x' || k === 'X') v = 'X';
    else if (k === 'm' || k === 'M') v = 'M';
    if (v) { e.preventDefault(); enter(v); }
    else if (k === 'Backspace') { e.preventDefault(); del(); }
  });

  /* ---------- example match (shown once, can be deleted) ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seedExample() {
    var m = makeMatch({
      date: todayStr(), place: '', ends: 10, arrows: 3,
      teams: [
        { name: 'SV Eichenhain', archers: ['Lena', 'Jonas', 'Mia'].map(function (n) { return { name: n, nr: '', use: true }; }) },
        { name: 'BSV Talblick', archers: ['Paul', 'Sophie', 'Tim'].map(function (n) { return { name: n, nr: '', use: true }; }) }
      ]
    });
    m.example = true;
    var rand = rng(20261108), means = [8.6, 7.9, 8.1, 8.3, 7.7, 8.0], idx = 0;
    m.teams.forEach(function (t) {
      t.archers.forEach(function (a) {
        var mu = means[idx++], arr = m.scores[a.id];
        for (var e = 0; e < 6; e++) {
          var seg = [];
          for (var k = 0; k < 3; k++) {
            var u1 = rand() || 1e-9, u2 = rand();
            var z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            var r = Math.round(mu + 1.5 * z);
            seg.push(r >= 11 ? 'X' : r <= 0 ? 'M' : String(r));
          }
          seg.sort(function (x, y) { return ORDER[y] - ORDER[x]; });
          seg.forEach(function (v, kk) { arr[e * 3 + kk] = v; });
        }
      });
    });
    m.cur = { a: m.teams[0].archers[0].id, i: 18 };
    return m;
  }

  /* ---------- start ---------- */
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (ns) {
        dl = ns || null;
        if (dl && ui.view === 'match' && ui.result) render();
      }, function () { dl = null; });
    }
  } catch (e) { dl = null; }
  /* Web-App: Dateien über das Teilen-Menü (iPhone) oder als Download speichern; offline über den Service Worker */
  if (!dl) dl = { save: function (o) {
    return new Promise(function (res, rej) {
      try {
        var f = new File([o.data], o.filename, { type: o.data.type || 'application/octet-stream' });
        if (navigator.share && navigator.canShare && navigator.maxTouchPoints > 1 && navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f] }).then(res, function (e) { rej(e && e.name === 'AbortError' ? { code: 'declined' } : e); }); return;
        }
      } catch (e) { /* weiter mit Download */ }
      var u = URL.createObjectURL(o.data), a = document.createElement('a');
      a.href = u; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 4000); res();
    });
  } };
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', function () { if (nw.state === 'activated' && navigator.serviceWorker.controller) window.__appUpdated = true; });
      });
    }, function () { /* ohne Offline-Modus weiter */ });
  }
  load();
  authLoad();
  document.addEventListener('pointerdown', function (e) { if (e.target.closest && e.target.closest('canvas.sig, svg.facein')) window.__busyInput = true; }, true);
  ['pointerup', 'pointercancel'].forEach(function (n) { document.addEventListener(n, function () { window.__busyInput = false; }, true); });
  setInterval(function () { if (auth && !document.hidden && !sync.busy) schedSync(true); }, 45000);
  window.addEventListener('online', function () { schedSync(true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) schedSync(true); });
  store.matches = store.matches.filter(function (x) { return !x.example; });  /* Beispielkampf entfernt */
  store.seeded = true;
  applyTheme();
  save();
  if (store.openId && store.matches.some(function (x) { return x.id === store.openId; })) { ui.view = 'match'; ui.matchId = store.openId; ui.sport = sportOf(store.matches.filter(function (x) { return x.id === store.openId; })[0]); }
  render({ top: true });
  if (auth) schedSync(true);
  setTimeout(function () { try { var j = document.createElement('script'); j.async = true; j.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; document.head.appendChild(j); } catch (x) { /* PDF optional */ } }, 300);
})();
